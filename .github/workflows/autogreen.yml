name: Autogreen

on:
  schedule:
    # 每天 UTC 01:17（可改成任意分钟，减轻整点任务拥堵）
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autogreen
  cancel-in-progress: true

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub 贡献图颜色深浅主要由「当天提交次数」决定；随机多次提交 → 随机深浅的绿色
      - name: Random commits and push
        env:
          EMAIL: ${{ secrets.AUTOGREEN_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "${EMAIL:-}" ]; then
            echo "::error::请在仓库 Settings → Secrets → Actions 中添加 AUTOGREEN_EMAIL，值为你在 GitHub 上已验证的邮箱，否则提交不会计入贡献图。"
            exit 1
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "$EMAIL"

          # 每天 1～10 次提交（bash RANDOM），可按需改范围
          COMMITS=$((1 + RANDOM % 10))
          echo "Today's random commit count: $COMMITS"

          : > .autogreen
          for i in $(seq 1 "$COMMITS"); do
            printf '%s #%d %s\n' "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" "$i" "$(openssl rand -hex 4)" >> .autogreen
            git add .autogreen
            git commit -m "chore: autogreen $(date -u +%Y-%m-%d) [$i/$COMMITS]"
          done
          git push
